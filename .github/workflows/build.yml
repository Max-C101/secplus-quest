name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          # Strip any whitespace or line breaks picked up when the secret was pasted
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Fingerprint of the encrypted keystore file (safe to log) to confirm it arrived intact
          echo "Keystore size: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"
          echo "Keystore sha256 (first 16): $(sha256sum "$RUNNER_TEMP/release.keystore" | cut -c1-16)"

      - name: Build APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SecPlusQuest.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sec+ Quest build ${{ github.run_number }}
          body: Download **SecPlusQuest.apk** below on your Android phone and open it to install or update.
          files: SecPlusQuest.apk
          make_latest: true
