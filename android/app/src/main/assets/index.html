function statsView(){
  const r=readiness(), pct=Math.round(r*100), C=2*Math.PI*46;
  const seenIds=Object.keys(S.srs).filter(id=>ALLQ[id]), tot=seenIds.reduce((a,id)=>a+S.srs[id].s,0), cor=seenIds.reduce((a,id)=>a+S.srs[id].c,0);
  const dte=daysToExam(), unmast=TOTALQ-Object.keys(ALLQ).filter(id=>box(id)>=4).length;
  let h=`<div class="card ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="46" fill="none" stroke="#e5e5e5" stroke-width="12"/>
    <circle cx="56" cy="56" r="46" fill="none" stroke="${pct>=85?"#58cc02":pct>=50?"#ffc800":"#1cb0f6"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-r)}" transform="rotate(-90 56 56)"/>
    <text x="56" y="63" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="24" fill="#3c3c3c">${pct}%</text></svg>
    <div><h3>Exam readiness</h3><div class="muted">This is mastery weighted by each domain's share of the exam. A question counts as mastered after 4 correct reviews in a row, spaced out.</div></div></div>`;
  if(dte!=null&&dte>0) h+=`<div class="card"><h3>📅 ${dte} days to go</h3><div class="muted">To master every question by exam day, aim for about <b>${Math.max(1,Math.ceil(unmast/Math.max(1,dte-7)))}</b> questions a day. That leaves the last week for practice exams.</div></div>`;
  h+=`<div class="card"><h3>By domain</h3>`;
  UNITS.forEach(u=>{const m=Math.round(mastery(unitQids(u))*100);h+=`<div class="dom" style="${uvars(u)}"><div class="row"><span>${u.n}. ${esc(u.name)}</span><span style="color:${u.t}">${m}%</span></div><div class="pbar"><i style="width:${m}%"></i></div></div>`});
  h+=`</div>`;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d}), vals=days.map(d=>S.days[dayKey(d)]||0), mx=Math.max(S.settings.goal,...vals);
  h+=`<div class="card"><h3>This week</h3><div class="week">${days.map((d,i)=>`<div><span class="${vals[i]>=S.settings.goal?"hit":""}" style="height:${Math.max(6,vals[i]/mx*72)}px"></span><em>${"SMTWTFS"[d.getDay()]}</em></div>`).join("")}</div></div>`;
  h+=`<div class="grid2" style="margin-bottom:14px"><div class="mini"><div class="v">⚡ ${S.xp}</div><div class="l">total XP</div></div><div class="mini"><div class="v">🔥 ${S.longest}</div><div class="l">longest streak</div></div>
    <div class="mini"><div class="v">${LESSONS.filter(isDone).length}/${LESSONS.length}</div><div class="l">lessons done</div></div><div class="mini"><div class="v">${tot?Math.round(cor/tot*100):0}%</div><div class="l">answer accuracy</div></div></div>`;
  h+=`<div class="card"><h3>Settings</h3>
    <div style="margin-top:12px;font-weight:800">Exam date</div><input type="date" id="examDate" value="${esc(S.settings.examDate)}">
    <div style="margin-top:16px;font-weight:800">Daily XP goal</div><div class="seg">${[10,20,30,50].map(g=>`<button class="${S.settings.goal===g?"on":""}" data-act="goal" data-v="${g}">${g}</button>`).join("")}</div>
    <div class="row" style="margin-top:16px"><span style="font-weight:800">Sound effects</span><button class="toggle ${S.settings.sound?"on":""}" data-act="sound" aria-label="Sound"></button></div>
    <div style="margin-top:16px">${syncHTML()}</div>
    <button class="btn plain" data-act="resetAsk" style="margin-top:10px;color:var(--red-d)">Reset all progress</button></div>`;
  return h }

/* ---------- sheets ---------- */
function openSheet(html,style){overlay={html,style:style||""};drawOverlay()}
function closeSheet(){overlay=null;drawOverlay()}
function drawOverlay(){let el=document.getElementById("ov");if(el)el.remove();if(!overlay)return;
  el=document.createElement("div");el.id="ov";el.className="overlay";el.innerHTML=`<div class="sheet" style="${overlay.style}">${overlay.html}</div>`;
  el.addEventListener("click",e=>{if(e.target===el)closeSheet()});document.body.appendChild(el)}

function lessonSheet(id){ const l=BYID[id], u=l.u, rec=S.lessons[id], un=isUnlocked(l);
  let h=`<div class="qlabel"><span class="dot"></span>Unit ${u.n} · Lesson ${l.li+1} of ${u.lessons.length}</div><h2 style="margin-top:6px">${esc(l.t)}</h2>
    <ul>${l.intro.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(!un) h+=`<button class="btn" disabled>🔒 Finish "${esc(u.lessons[l.li-1].t)}" first</button>`;
  else{ h+=rec?`<div class="muted" style="margin-bottom:14px">Completed ${rec.done}× · best ${rec.best}%</div>`:"";
    h+=`<button class="btn" data-act="startLesson" data-v="${id}" style="background:${u.c};box-shadow:0 4px 0 ${u.d}">${rec?"Practice again +10 XP":"Start +10 XP"}</button>`;}
  openSheet(h,uvars(u)) }
function heartsSheet(){ regen();
  openSheet(`<h2>❤️ ${S.hearts} / ${MAXH} hearts</h2><ul style="--uc:var(--red)"><li>You lose a heart for each wrong answer in a lesson.</li><li>One heart refills every 2 hours${S.hearts<MAXH?` (next in ${fmtHM(nextHeartIn())})`:""}.</li><li>Review and domain drills never cost hearts, and finishing one earns a heart back.</li></ul>
  <button class="btn blue" data-act="startReview" ${Object.keys(S.srs).length?"":"disabled"}>Practice to earn a heart</button><button class="btn ghost" data-act="close">Close</button>`) }
function noHeartsSheet(){ openSheet(`<div class="center"><div style="font-size:60px">💔</div><h2>Out of hearts</h2><div class="muted" style="margin:6px 0 18px">Next heart in ${fmtHM(nextHeartIn())}. Or practice now to earn one back.</div></div>
  <button class="btn blue" data-act="startReview">Practice to earn a heart</button><button class="btn ghost" data-act="close">Later</button>`) }

/* ---------- sessions ---------- */
function mkQ(id){ const Q=ALLQ[id], tf=Q.opts.length===2&&Q.opts.includes("True")&&Q.opts.includes("False");
  return {kind:"mcq",id,q:Q.q.replace(/\s*True or False\?\s*$/,""),opts:tf?["True","False"]:shuffle(Q.opts.slice()),ans:Q.opts[0],e:Q.e,tf,u:Q.u} }
function newSess(mode,items,extra){ return Object.assign({mode,items,i:0,goal:items.length,cleared:0,ok:0,bad:0,combo:0,maxCombo:0,t0:Date.now(),state:"answer",sel:null,answers:[]},extra||{}) }
function begin(s){ closeSheet(); sess=s; view="session"; render(); window.scrollTo(0,0) }

function startLesson(id){ regen(); if(S.hearts<=0){noHeartsSheet();return}
  const l=BYID[id], qs=shuffle(l.qids.slice()).map(mkQ), items=[];
  if(!isDone(l)) items.push({kind:"intro",l});
  const mid=Math.min(4,qs.length); items.push(...qs.slice(0,mid),{kind:"match",pairs:l.pairs,u:l.u},...qs.slice(mid));
  begin(newSess("lesson",items,{l})) }
function practiceIds(pool,n){ const now=Date.now(), due=pool.filter(id=>S.srs[id]&&S.srs[id].d<=now).sort((a,b)=>S.srs[a].d-S.srs[b].d);
  const seen=shuffle(pool.filter(id=>S.srs[id]&&!due.includes(id))).sort((a,b)=>box(a)-box(b));
  const rest=shuffle(pool.filter(id=>!S.srs[id])); return [...due,...seen,...rest].slice(0,n) }
function startReview(){ let pool=Object.keys(S.srs).filter(id=>ALLQ[id]);
  if(pool.length<8){ const extra=LESSONS.filter(l=>isUnlocked(l)).flatMap(l=>l.qids); pool=[...new Set([...pool,...extra])] }
  const ids=practiceIds(pool,10); begin(newSess("review",shuffle(ids).map(mkQ),{title:"Review"})) }
function startDomain(n){ const u=UNITS[n-1]; begin(newSess("review",shuffle(practiceIds(unitQids(u),10)).map(mkQ),{title:u.name})) }
function startExam(){ const per=[4,7,5,8,6], ids=[]; UNITS.forEach((u,i)=>ids.push(...shuffle(unitQids(u).slice()).slice(0,per[i])));
  const s=newSess("exam",shuffle(ids).map(mkQ),{deadline:Date.now()+35*6e4}); begin(s);
  s.tick=setInterval(()=>{ const el=document.getElementById("timer"), left=s.deadline-Date.now(); if(el){el.textContent=fmtDur(left);el.classList.toggle("low",left<5*6e4)} if(left<=0&&sess===s)finish() },1000) }

function renderSession(){
  const s=sess, it=s.items[s.i];
  const pct=s.mode==="exam"?Math.round(100*s.i/s.items.length):Math.round(100*s.cleared/s.goal);
  const right=s.mode==="lesson"?`<span class="hp">❤️ ${S.hearts}</span>`:s.mode==="exam"?`<span class="timer" id="timer">${fmtDur(s.deadline-Date.now())}</span>`:`<span class="tag">PRACTICE</span>`;
  let body="", foot="";
  const u=it.u||(it.l&&it.l.u)||UNITS[0];
  if(it.kind==="intro"){
    body=`<div class="qlabel"><span class="dot"></span>New lesson</div><div class="intro-title">${esc(it.l.t)}</div><div class="muted">Learn these first, then you'll be quizzed on them.</div>
      ${it.l.intro.map((x,i)=>`<div class="intro-card"><b>${i+1}</b><span>${esc(x)}</span></div>`).join("")}`;
    foot=`<div class="foot"><div class="foot-in"><button class="btn" data-act="next">Got it</button></div></div>`;
  } else if(it.kind==="match"){
    if(!s.m){ const idx=it.pairs.map((_,i)=>i); s.m={L:shuffle(idx.slice()),R:shuffle(idx.slice()),sl:null,sr:null,done:new Set(),badL:null,badR:null} }
    const m=s.m, tile=(side,i)=>{const isL=side==="L", txt=it.pairs[i][isL?0:1], ok=m.done.has(i), sel=isL?m.sl===i:m.sr===i, bad=isL?m.badL===i:m.badR===i;
      return `<button class="tile ${isL?"term":""} ${ok?"ok":bad?"bad":sel?"sel":""}" data-act="tile" data-v="${side}${i}" ${ok?"disabled":""}>${esc(txt)}</button>`};
    body=`<div class="qlabel"><span class="dot"></span>Match the pairs</div><div class="qtext" style="font-size:19px">Tap a term, then its meaning</div>
      <div class="match"><div class="mcol">${m.L.map(i=>tile("L",i)).join("")}</div><div class="mcol">${m.R.map(i=>tile("R",i)).join("")}</div></div>`;
    foot=s.state==="feedback"?fb(true,"All matched!",""):`<div class="foot"><div class="foot-in"><button class="btn" disabled>Check</button></div></div>`;
  } else {
    const lock=s.state==="feedback";
    const opt=(o,k)=>{let c=""; if(lock){ if(o===it.ans)c="good"; else if(k===s.sel)c="bad"; else c="dim" } else if(k===s.sel)c="sel";
      return `<button class="opt ${c}" data-act="pick" data-v="${k}" ${lock?"disabled":""}><span class="k">${k+1}</span><span>${esc(o)}</span></button>`};
    const lbl=s.mode==="exam"?`Question ${s.i+1} of ${s.items.length}`:it.tf?"True or false?":"Select the correct answer";
    body=`<div class="qlabel"><span class="dot"></span>${lbl}<span style="color:var(--sub);font-weight:800;text-transform:none;letter-spacing:0">· D${u.n}</span></div>
      <div class="qtext">${esc(it.q)}</div>${it.tf?`<div class="tfrow">${it.opts.map(opt).join("")}</div>`:it.opts.map(opt).join("")}`;
    if(s.mode==="exam") foot=`<div class="foot"><div class="foot-in"><button class="btn blue" data-act="examNext" ${s.sel==null?"disabled":""}>${s.i===s.items.length-1?"Finish":"Next"}</button></div></div>`;
    else if(lock) foot=s.last?fb(true,praise(),it.e):fb(false,"Correct answer:",it.e,it.ans);
    else foot=`<div class="foot"><div class="foot-in"><button class="btn" data-act="check" ${s.sel==null?"disabled":""}>Check</button></div></div>`;
  }
  app.innerHTML=`<div class="lesson" style="${uvars(u)}"><div class="lhead"><button class="x" data-act="quit" aria-label="Quit">✕</button><div class="bar"><i style="width:${pct}%"></i></div>${right}</div><div class="lbody">${body}</div>${foot}</div>`;
}
const PRAISE=["Nicely done!","Correct!","You got it!","Great job!","Awesome!","Exactly right!"];
function praise(){const p=PRAISE[Math.floor(Math.random()*PRAISE.length)]; return sess.combo>=3?`${p}<span class="combo">🔥 ${sess.combo} in a row</span>`:p}
function fb(ok,title,text,ans){ return `<div class="foot ${ok?"good":"bad"}"><div class="foot-in"><div class="fb"><div class="fb-ic">${ok?"✓":"✕"}</div><div>
  <div class="fb-title">${title}</div>${ans?`<div class="fb-ans">${esc(ans)}</div>`:""}${text?`<div class="fb-text">${esc(text)}</div>`:""}</div></div>
  <button class="btn ${ok?"":"red"}" data-act="next">Continue</button></div></div>` }

function pick(k){ if(!sess||sess.state!=="answer")return; sess.sel=k; sfx("tap"); renderSession() }
function check(){ const s=sess, it=s.items[s.i]; if(!s||s.sel==null||s.state!=="answer"||it.kind!=="mcq")return;
  const ok=it.opts[s.sel]===it.ans; s.last=ok; s.state="feedback";
  if(!it.re){ grade(it.id,ok); ok?s.ok++:s.bad++ }
  if(ok){ s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo); s.cleared++; sfx("good") }
  else{ s.combo=0; sfx("bad"); if(s.mode==="lesson")loseHeart();
    if(!it.re) s.items.push(Object.assign(mkQ(it.id),{re:true})); else s.cleared++ }
  save(); renderSession() }
function next(){ const s=sess, it=s.items[s.i]; if(!s)return;
  if(it.kind==="intro"){ s.cleared++ }
  if(it.kind==="mcq"&&s.state!=="feedback")return;
  if(it.kind==="match"&&s.state!=="feedback")return;
  if(s.mode==="lesson"&&S.hearts<=0){ outOfHearts(); return }
  s.i++; s.sel=null; s.state="answer"; s.m=null;
  if(s.i>=s.items.length) finish(); else { renderSession(); window.scrollTo(0,0) } }
function tile(v){ const s=sess, m=s.m, it=s.items[s.i]; if(!m||s.state!=="answer")return;
  const side=v[0], i=+v.slice(1); if(m.done.has(i))return;
  if(side==="L")m.sl=m.sl===i?null:i; else m.sr=m.sr===i?null:i;
  m.badL=m.badR=null;
  if(m.sl!=null&&m.sr!=null){
    if(m.sl===m.sr){ m.done.add(m.sl); sfx("pair") } else { m.badL=m.sl; m.badR=m.sr; sfx("bad"); const bl=m.badL,br=m.badR;
      setTimeout(()=>{ if(sess===s&&s.m===m&&m.badL===bl&&m.badR===br){m.badL=m.badR=null;renderSession()} },600) }
    m.sl=m.sr=null;
    if(m.done.size===it.pairs.length){ s.state="feedback"; s.last=true; s.cleared++; setTimeout(()=>sfx("good"),120) }
  } else sfx("tap");
  renderSession() }
function examNext(){ const s=sess, it=s.items[s.i]; if(s.sel==null)return;
  const ok=it.opts[s.sel]===it.ans; grade(it.id,ok); ok?s.ok++:s.bad++; s.answers.push({id:it.id,chosen:it.opts[s.sel],ok,u:it.u.n});
  s.sel=null; s.i++; save(); if(s.i>=s.items.length)finish(); else { renderSession(); window.scrollTo(0,0) } }
function outOfHearts(){ app.innerHTML=`<div class="result"><div class="big">💔</div><h1 style="color:var(--red-d)">Out of hearts</h1>
  <div class="muted">Wrong answers cost hearts in lessons. Next heart in ${fmtHM(nextHeartIn())}.<br>Practice mode is free and earns a heart back.</div>
  <div style="margin-top:auto"><button class="btn blue" data-act="startReview">Practice to earn a heart</button><button class="btn ghost" data-act="home">End lesson</button></div></div>`;
  view="result"; sess=null }

function finish(){ const s=sess; if(!s)return; clearInterval(s.tick); overlay=null; drawOverlay();
  const graded=s.ok+s.bad, acc=graded?Math.round(s.ok/graded*100):100; let xp=0;
  s.acc=acc; s.time=Date.now()-s.t0;
  if(s.mode==="lesson"){ xp=10+(s.bad===0?5:0); const rec=S.lessons[s.l.id]||{done:0,best:0}; rec.done++; rec.best=Math.max(rec.best,acc); S.lessons[s.l.id]=rec }
  else if(s.mode==="review"){ xp=5+Math.round(s.ok/2); if(S.hearts<MAXH){ S.hearts++; s.heart=true } }
  else { xp=s.ok; const n=s.items.length, by={}; s.answers.forEach(a=>{by[a.u]=by[a.u]||{ok:0,n:0};by[a.u].n++;if(a.ok)by[a.u].ok++});
    s.by=by; s.pct=Math.round(s.ok/n*100); S.exams.push({at:Date.now(),ok:s.ok,n,pct:s.pct}); if(S.exams.length>50)S.exams.shift() }
  s.xp=xp; s.goalHit=addXP(xp); save(); sess=null; view="result"; renderResult(s); sfx("done") }

function confetti(){ const cs=["#58cc02","#1cb0f6","#ffc800","#ff4b8b","#ce82ff","#ff9600"]; let h="";
  for(let i=0;i<36;i++)h+=`<span class="confetti" style="left:${Math.random()*100}%;background:${cs[i%6]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s"></span>`; return h }
function renderResult(s){
  if(s.mode==="exam"){ const p=s.pct, v=p>=85?["🏆","Exam-ready pace!","var(--green-d)"]:p>=70?["💪","Getting close","var(--gold-d)"]:["📚","Keep drilling","var(--blue-d)"];
    const missed=s.answers.filter(a=>!a.ok), unans=s.items.length-s.answers.length;
    app.innerHTML=`<div class="result">${p>=85?confetti():""}<div class="big">${v[0]}</div><h1 style="color:${v[2]}">${p}% · ${v[1]}</h1>
      <div class="muted">${s.ok} of ${s.items.length} correct in ${fmtDur(s.time)}${unans?` · ${unans} unanswered (time ran out)`:""}. Aim for 85%+ before booking.</div>
      <div class="card" style="text-align:left;margin-top:20px">${UNITS.map(u=>{const b=s.by[u.n]||{ok:0,n:0},m=b.n?Math.round(b.ok/b.n*100):0;
        return `<div class="dom" style="${uvars(u)}"><div class="row"><span>${u.n}. ${esc(u.name)}</span><span style="color:${u.t}">${b.ok}/${b.n}</span></div><div class="pbar"><i style="width:${m}%"></i></div></div>`}).join("")}</div>
      ${missed.length?`<h2 class="sec" style="text-align:left">Review your misses</h2><div class="missed">${missed.map(a=>{const Q=ALLQ[a.id];
        return `<div class="card"><div class="q">${esc(Q.q.replace(/\s*True or False\?\s*$/,""))}</div><div class="a y">✕ ${esc(a.chosen)}</div><div class="a c">✓ ${esc(Q.opts[0])}</div><div class="e">${esc(Q.e)}</div></div>`}).join("")}</div>`:""}
      <div style="margin-top:16px"><button class="btn" data-act="home">Continue</button></div></div>`;
    return }
  const perfect=s.mode==="lesson"&&s.bad===0;
  app.innerHTML=`<div class="result">${confetti()}<div class="big">${perfect?"🌟":"🎉"}</div><h1>${s.mode==="lesson"?(perfect?"Perfect lesson!":"Lesson complete!"):"Practice complete!"}</h1>
    <div class="muted">${s.mode==="lesson"?esc(s.l.t):esc(s.title||"")}</div>
    <div class="tiles"><div class="rt" style="--c:var(--gold)"><div class="h">Total XP</div><div class="v">⚡${s.xp}</div></div>
      <div class="rt" style="--c:var(--green)"><div class="h">${s.acc>=90?"Amazing":"Accuracy"}</div><div class="v">${s.acc}%</div></div>
      <div class="rt" style="--c:var(--blue)"><div class="h">Time</div><div class="v">${fmtDur(s.time)}</div></div></div>
    ${s.goalHit?`<div class="banner fire"><span class="e">🔥</span><span>Daily goal hit! You're on a <b>${S.streak}-day streak</b>.</span></div>`:""}
    ${s.heart?`<div class="banner heart"><span class="e">❤️</span><span>You earned a heart back (${S.hearts}/${MAXH}).</span></div>`:""}
    ${s.maxCombo>=5?`<div class="banner fire"><span class="e">⚡</span><span>Best combo: ${s.maxCombo} in a row</span></div>`:""}
    <div style="margin-top:auto;padding-top:20px"><button class="btn" data-act="home">Continue</button></div></div>` }

/* ---------- main render ---------- */
function render(){
  if(view==="session"){renderSession();return}
  regen();
  const body=view==="review"?reviewView():view==="exam"?examView():view==="stats"?statsView():learnView();
  app.innerHTML=header()+`<main>${body}</main>`+nav();
  const di=document.getElementById("examDate"); if(di)di.addEventListener("change",()=>{S.settings.examDate=di.value;save();render()});
  drawOverlay() }

const ACT={
  go:v=>{view=v;overlay=null;render();window.scrollTo(0,0)},
  home:()=>{sess=null;view="learn";overlay=null;render();window.scrollTo(0,0)},
  lessonSheet:v=>lessonSheet(v), startLesson:v=>startLesson(v), startReview:()=>startReview(), startDomain:v=>startDomain(+v), startExam:()=>startExam(),
  close:()=>closeSheet(), hearts:()=>heartsSheet(),
  streakInfo:()=>openSheet(`<h2>🔥 ${curStreak()}-day streak</h2><ul style="--uc:var(--orange)"><li>Hit your daily goal (${S.settings.goal} XP) to keep the streak going.</li><li>Your longest streak is ${S.longest} days.</li><li>Lessons give 10 XP (15 if perfect). Practice gives 5+ XP, and exams give 1 XP per correct answer.</li></ul><button class="btn ghost" data-act="close">Got it</button>`),
  xpInfo:()=>openSheet(`<h2>⚡ ${S.xp} XP</h2><div class="muted" style="margin:8px 0 18px">${S.days[dayKey()]||0} XP today. Change your daily goal in Stats.</div><button class="btn ghost" data-act="close">Close</button>`),
  pick:v=>pick(+v), check:()=>check(), next:()=>next(), tile:v=>tile(v), examNext:()=>examNext(),
  quit:()=>openSheet(`<div class="center"><div style="font-size:54px">🥺</div><h2>Wait, don't go!</h2><div class="muted" style="margin:6px 0 18px">${sess&&sess.mode==="exam"?"This exam attempt won't be scored.":"You'll lose this session's progress."} Answers you've already checked still count toward review.</div></div>
    <button class="btn" data-act="close">Keep going</button><button class="btn plain" data-act="quitYes" style="color:var(--red-d)">End session</button>`),
  quitYes:()=>{ if(sess)clearInterval(sess.tick); save(); ACT.home() },
  goal:v=>{S.settings.goal=+v;save();render()},
  sound:()=>{S.settings.sound=!S.settings.sound;save();render();sfx("good")},
  resetAsk:()=>openSheet(`<h2>Reset all progress?</h2><div class="muted" style="margin:6px 0 18px">This clears XP, streaks, lessons, review history and exam scores. You can't undo it.</div><button class="btn red" data-act="resetYes">Reset everything</button><button class="btn ghost" data-act="close">Cancel</button>`),
  resetYes:()=>{const keep=S.settings;S=defState();S.settings=keep;save();overlay=null;view="learn";render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v)}});
document.addEventListener("keydown",e=>{ if(view!=="session"||!sess||overlay)return; const it=sess.items[sess.i];
  if(it.kind==="mcq"&&sess.state==="answer"&&/^[1-9]$/.test(e.key)&&+e.key<=it.opts.length){pick(+e.key-1)}
  else if(e.key==="Enter"){ e.preventDefault(); if(sess.mode==="exam")examNext(); else if(it.kind==="mcq"&&sess.state==="answer")check(); else next() } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&view!=="session"&&view!=="result"){ if(regen())save(); render() } });

/* Android app hooks: hardware back button and widget "Practice" button */
window.__back=function(){
  if(overlay){closeSheet();return true}
  if(view==="session"&&sess){ACT.quit();return true}
  if(view==="result"){ACT.home();return true}
  if(view!=="learn"){ACT.go("learn");return true}
  return false };
window.__openReview=function(){ if(view==="session")return; startReview() };

if(regen())save();
render();
pushWidget();
if(location.hash==="#review"&&view!=="session"){ try{history.replaceState(null,"",location.pathname)}catch(e){} startReview() }
initCloud();
})();
</script>
</body>
</html>
