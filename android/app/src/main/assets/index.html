<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sec+ Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58cc02;--green-d:#58a700;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#ea2b2b;
  --gold:#ffc800;--gold-d:#e5a800;--orange:#ff9600;--line:#e5e5e5;--line-d:#cfcfcf;--gray-d:#afafaf;
  --text:#3c3c3c;--sub:#777;--purple:#ce82ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--text);font-family:Nunito,system-ui,-apple-system,sans-serif;color-scheme:light}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* header */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.chip{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px}
.chip small{font-weight:800;font-size:11px;color:var(--sub);border:2px solid var(--line);border-radius:8px;padding:1px 6px}
.stats{display:flex;gap:14px}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;background:none;border:0;padding:4px 2px;color:var(--text)}
.stat.fire{color:var(--orange)} .stat.dim{color:var(--gray-d)} .stat.dim .em{filter:grayscale(1);opacity:.6}
.stat.xp{color:var(--gold-d)} .stat.heart{color:var(--red)}

main{padding:16px 16px calc(100px + env(safe-area-inset-bottom))}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;max-width:520px;margin:0 auto}
.nav button{flex:1;background:none;border:0;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-weight:800;font-size:11px;color:var(--sub);letter-spacing:.05em;text-transform:uppercase}
.nav .ico{width:46px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:21px;border:2px solid transparent}
.nav button.on{color:var(--blue-d)} .nav button.on .ico{background:#ddf4ff;border-color:#84d8ff}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font-weight:900;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .06s,box-shadow .06s;margin-bottom:4px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#6b4e00}
.btn.ghost{background:#fff;color:var(--blue-d);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.plain{background:none;box-shadow:none;color:var(--blue-d)}
.btn:disabled{background:var(--line);color:var(--gray-d);box-shadow:0 4px 0 var(--line-d);cursor:default}
.btn + .btn{margin-top:12px}

/* cards */
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:18px;font-weight:900}
.muted{color:var(--sub);font-weight:700;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .4s}
.pbar.green i{background:var(--green)}
.link{background:none;border:0;color:var(--blue-d);font-weight:900;font-size:14px;padding:0;text-transform:uppercase;letter-spacing:.04em}

/* path */
.unit{border-radius:18px;padding:16px 18px;color:#fff;margin:22px 0 4px;box-shadow:0 5px 0 var(--ud);background:var(--uc)}
.unit .k{font-weight:900;font-size:13px;opacity:.9;letter-spacing:.06em;text-transform:uppercase}
.unit .n{font-weight:900;font-size:20px;margin-top:2px}
.unit .w{font-weight:800;font-size:13px;margin-top:6px;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px 0 12px}
.stop{display:flex;flex-direction:column;align-items:center;position:relative}
.node{position:relative;width:74px;height:68px;border-radius:50%;border:0;background:var(--uc);box-shadow:0 8px 0 var(--ud);
  display:grid;place-items:center;transition:transform .06s,box-shadow .06s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ud)}
.node svg{width:34px;height:34px}
.node.locked{background:#e5e5e5;box-shadow:0 8px 0 #b7b7b7}
.node.locked:active{box-shadow:0 2px 0 #b7b7b7}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d)}
.node.done:active{box-shadow:0 2px 0 var(--gold-d)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--uc);opacity:.35;animation:pulse 1.6s ease-in-out infinite}
.bubble{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);color:var(--uc2);
  font-weight:900;font-size:14px;padding:6px 12px;border-radius:12px;letter-spacing:.06em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.bubble::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.crowns{position:absolute;right:-8px;bottom:-4px;background:#fff;border:2px solid var(--gold-d);color:var(--gold-d);font-weight:900;font-size:12px;border-radius:99px;padding:0 6px}
.slabel{margin-top:14px;font-weight:800;font-size:13px;color:var(--sub);text-align:center;max-width:150px;line-height:1.2}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.08);opacity:.15}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}

/* overlay sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:900}
.sheet ul{padding-left:0;list-style:none;margin:14px 0 18px}
.sheet li{display:flex;gap:10px;font-weight:700;font-size:15px;line-height:1.35;margin-bottom:10px}
.sheet li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--uc,var(--blue));margin-top:6px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* lesson */
.lesson{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
.lhead{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:24px;color:var(--gray-d);padding:4px 6px;font-weight:900}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;position:relative}
.bar i::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.hp{font-weight:900;color:var(--red);font-size:16px;white-space:nowrap}
.tag{font-weight:900;font-size:12px;color:var(--blue-d);letter-spacing:.06em}
.timer{font-weight:900;font-size:15px;color:var(--blue-d);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.timer.low{color:var(--red)}
.lbody{flex:1;padding:22px 0 300px}
.qlabel{font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--uc2,var(--purple));display:flex;gap:8px;align-items:center}
.qlabel .dot{width:10px;height:10px;border-radius:50%;background:var(--uc,var(--purple))}
.qtext{font-size:21px;font-weight:800;line-height:1.32;margin:10px 0 22px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;
  border-radius:14px;padding:13px 14px;font-weight:700;font-size:16px;color:var(--text);margin-bottom:10px;line-height:1.3}
.opt:active:not(:disabled){border-bottom-width:2px;transform:translateY(2px)}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--gray-d);flex:none;font-weight:900}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;color:var(--blue-d)} .opt.sel .k{border-color:#84d8ff;color:var(--blue-d)}
.opt.good{border-color:#a5ed6e;background:#d7ffb8;color:var(--green-d)} .opt.good .k{border-color:#a5ed6e;color:var(--green-d)}
.opt.bad{border-color:#ffb2b2;background:#ffdfe0;color:var(--red-d)} .opt.bad .k{border-color:#ffb2b2;color:var(--red-d)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{justify-content:center;padding:22px 10px;font-size:18px;font-weight:900}
.tfrow .opt .k{display:none}
.intro-title{font-size:26px;font-weight:900;margin:8px 0 6px}
.intro-card{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;font-weight:700;font-size:16px;line-height:1.4;display:flex;gap:12px}
.intro-card b{color:var(--uc2,var(--blue-d));font-size:18px;flex:none}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.tile{min-height:66px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px;font-weight:800;font-size:14px;
  color:var(--text);line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center}
.tile.term{font-size:15px;font-weight:900}
.tile.sel{border-color:#84d8ff;background:#ddf4ff;color:var(--blue-d)}
.tile.bad{border-color:#ffb2b2;background:#ffdfe0;color:var(--red-d);animation:shake .35s}
.tile.ok{border-color:var(--line);color:#ccc;background:#fafafa;border-bottom-width:2px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:30}
.foot-in{max-width:520px;margin:0 auto}
.foot.good{background:#d7ffb8;border-color:#d7ffb8;animation:up .2s}
.foot.bad{background:#ffdfe0;border-color:#ffdfe0;animation:up .2s}
.fb{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.fb-ic{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.good .fb-ic{color:var(--green-d)} .bad .fb-ic{color:var(--red-d)}
.fb-title{font-weight:900;font-size:19px}
.good .fb-title{color:var(--green-d)} .bad .fb-title{color:var(--red-d)}
.fb-ans{font-weight:800;font-size:16px;color:var(--red-d);margin-top:2px}
.fb-text{font-weight:700;font-size:14.5px;line-height:1.4;margin-top:6px}
.good .fb-text{color:#3f7a00} .bad .fb-text{color:#a3262b}
.combo{display:inline-block;margin-left:6px;font-size:13px;background:#fff;color:var(--orange);border-radius:99px;padding:1px 8px;vertical-align:middle}

/* result */
.result{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 30px) 18px calc(24px + env(safe-area-inset-bottom));text-align:center;position:relative;overflow:hidden}
.result .big{font-size:76px;line-height:1;margin:20px 0 10px;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.result h1{font-size:28px;font-weight:900;margin:8px 0;color:var(--gold-d)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.rt{border:2px solid var(--c);border-radius:16px;overflow:hidden}
.rt .h{background:var(--c);color:#fff;font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px}
.rt .v{font-weight:900;font-size:21px;padding:12px 4px;color:var(--c)}
.banner{border-radius:16px;padding:14px;font-weight:800;margin-bottom:12px;text-align:left;display:flex;gap:12px;align-items:center}
.banner.fire{background:#fff3e0;color:#b35f00}
.banner.heart{background:#ffe8e8;color:var(--red-d)}
.banner .e{font-size:28px}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.missed{text-align:left;margin-top:6px}
.missed .card{padding:14px}
.missed .q{font-weight:800;font-size:15px;line-height:1.35}
.missed .a{font-weight:800;font-size:14px;margin-top:8px}
.missed .a.y{color:var(--red-d)} .missed .a.c{color:var(--green-d)}
.missed .e{font-weight:700;font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.4}

/* stats */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.dom{margin-bottom:14px}
.dom .row{font-weight:800;font-size:14px}
.dom .pbar{height:12px;margin-top:6px}
.dom .pbar i{background:var(--uc)}
.week{display:flex;gap:8px;align-items:flex-end;height:96px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week span{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--line);min-height:6px}
.week span.hit{background:var(--orange)}
.week em{font-style:normal;font-weight:800;font-size:11px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:2px solid var(--line);border-radius:14px;padding:12px}
.mini .v{font-weight:900;font-size:20px} .mini .l{font-weight:700;font-size:12.5px;color:var(--sub)}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:12px;padding:9px 0;font-weight:900;font-size:14px;color:var(--sub)}
.seg button.on{border-color:#84d8ff;background:#ddf4ff;color:var(--blue-d)}
input[type=date]{width:100%;margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:700 16px Nunito,system-ui;color:var(--text);background:#fff}
.toggle{width:54px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)} .toggle.on::after{left:26px}
.drow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;margin-bottom:10px;text-align:left;color:var(--text)}
.drow .sw{width:14px;height:40px;border-radius:6px;background:var(--uc);flex:none}
.drow .t{font-weight:900;font-size:15px}
.drow .s{font-weight:700;font-size:12.5px;color:var(--sub)}
.drow .pct{margin-left:auto;font-weight:900;color:var(--uc2)}
.hero{text-align:center;padding:22px 16px}
.hero .e{font-size:56px}
.sync{font-weight:700;font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--gray-d);display:inline-block}
.sync.ok i{background:var(--green)}
h2.sec{font-size:20px;font-weight:900;margin:18px 0 10px}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================================================
   CONTENT — CompTIA Security+ SY0-701
   Each question: [prompt, [CORRECT, distractor...], explanation]
   Options are shuffled at runtime (True/False keep fixed order).
   ============================================================ */
const UNITS = [
{ name:"General Security Concepts", w:12, c:"#58cc02", d:"#58a700", t:"#58a700", lessons:[
  { id:"gc1", t:"Control Types",
    intro:["4 categories: Technical, Managerial, Operational, Physical","6 types: Preventive, Deterrent, Detective, Corrective, Compensating, Directive","Category = WHO/WHAT implements it. Type = WHAT it does."],
    pairs:[["Preventive","Stops it before it happens"],["Deterrent","Discourages the attempt"],["Detective","Finds & records it"],["Corrective","Fixes it afterward"],["Compensating","Substitute when the primary isn't possible"]],
    qs:[
      ["A firewall rule that blocks inbound Telnet is which control CATEGORY?",["Technical","Managerial","Operational","Physical"],"Technical controls are implemented by systems — firewalls, OS settings, antivirus."],
      ["A company's annual risk assessment and security policies fall under which category?",["Managerial","Technical","Physical","Operational"],"Managerial (administrative) controls are about policies, procedures and oversight of security design."],
      ["Security awareness training run by people (not systems) is which category?",["Operational","Technical","Managerial","Physical"],"Operational controls are implemented by people rather than systems — training, guards following procedures."],
      ["A 'Warning: Premises Under Surveillance' sign is primarily which control TYPE?",["Deterrent","Detective","Preventive","Corrective"],"Deterrent controls discourage an attacker but don't physically stop them."],
      ["Restoring servers from backup after a ransomware infection is which control type?",["Corrective","Detective","Deterrent","Directive"],"Corrective controls reduce impact and restore systems after an event."],
      ["A legacy system can't be patched, so you isolate it on its own VLAN with strict ACLs. That VLAN is a ___ control.",["Compensating","Directive","Deterrent","Detective"],"Compensating controls are alternatives used when the primary control can't be applied."],
      ["A policy stating 'All employees must store files on the encrypted share' is which type?",["Directive","Preventive","Corrective","Compensating"],"Directive controls tell people what to do — they rely on compliance."],
      ["Reviewing logs to find unauthorized logins is a detective control. True or False?",["True","False"],"Detective controls identify and record events; they don't stop them."]
    ]},
  { id:"gc2", t:"CIA, AAA & Zero Trust",
    intro:["CIA = Confidentiality, Integrity, Availability","AAA = Authentication, Authorization, Accounting","Zero trust: never trust, always verify. Policy Engine decides, Policy Administrator relays, Policy Enforcement Point enforces."],
    pairs:[["Confidentiality","Only authorized people can read it"],["Integrity","Data hasn't been altered"],["Availability","Accessible when needed"],["Authentication","Proving who you are"],["Authorization","What you're allowed to do"]],
    qs:[
      ["Comparing a file's SHA-256 hash to a published value protects which part of the CIA triad?",["Integrity","Confidentiality","Availability","Non-repudiation"],"Hashes detect changes, which is integrity."],
      ["A DDoS attack mainly targets which part of the CIA triad?",["Availability","Confidentiality","Integrity","Accounting"],"Flooding a service so legitimate users can't reach it is an attack on availability."],
      ["Which provides non-repudiation for an email?",["Digital signature","Symmetric encryption","Hashing alone","A VPN"],"Only the sender's private key could make the signature, so the sender can't credibly deny sending it."],
      ["In AAA, logging which files a user opened and when is called:",["Accounting","Authorization","Authentication","Attestation"],"Accounting records what authenticated users did."],
      ["In a zero trust architecture, which component makes the allow/deny decision?",["Policy Engine","Policy Enforcement Point","Policy Administrator","Subject"],"The Policy Engine evaluates and decides. The Policy Administrator relays that decision to the PEP, which enforces it."],
      ["The Policy Enforcement Point sits in which plane?",["Data plane","Control plane","Management plane","Application plane"],"The Policy Engine and Policy Administrator are in the control plane. The PEP enforces in the data plane, where traffic flows."],
      ["Fake credentials planted in a database that trigger an alert when used are a:",["Honeytoken","Honeynet","Honeypot","Sinkhole"],"A honeytoken is a fake data item. A honeypot is a fake system, and a honeynet is a network of honeypots."],
      ["A gap analysis compares:",["Current security posture to a desired standard","Two vendors' prices","Log timestamps between servers","Backup sizes over time"],"A gap analysis shows where you are, where you need to be (like NIST or ISO), and the gap between them."]
    ]},
  { id:"gc3", t:"Crypto Basics",
    intro:["Symmetric = one shared key, fast (AES)","Asymmetric = public/private key pair (RSA, ECC)","Hashing is one-way. Salts beat rainbow tables. Key stretching slows brute force."],
    pairs:[["AES","Symmetric encryption"],["RSA","Asymmetric encryption"],["SHA-256","Hashing"],["Diffie-Hellman","Key exchange"],["bcrypt","Password key stretching"]],
    qs:[
      ["Which algorithm is SYMMETRIC?",["AES","RSA","ECC","Diffie-Hellman"],"AES uses the same key to encrypt and decrypt. RSA and ECC are asymmetric, and Diffie-Hellman is a key-exchange method."],
      ["To send Bob a message only Bob can read, you encrypt it with:",["Bob's public key","Bob's private key","Your private key","Your public key"],"Anyone can encrypt with Bob's public key, but only Bob's private key decrypts it."],
      ["To create a digital signature, the sender encrypts the message hash with:",["Their own private key","The recipient's public key","Their own public key","A shared symmetric key"],"Signing uses the sender's private key. Anyone can verify with the sender's public key."],
      ["Adding random data to each password before hashing defends mainly against:",["Rainbow table attacks","Phishing","On-path attacks","Replay attacks"],"Salting makes identical passwords produce different hashes, so precomputed rainbow tables become useless."],
      ["PBKDF2 and bcrypt are examples of:",["Key stretching","Steganography","Tokenization","Block chaining"],"Key stretching hashes many times, which makes each brute-force guess much slower."],
      ["Two different inputs producing the same hash is called a:",["Collision","Salt","Nonce","Downgrade"],"Strong hashes like SHA-256 resist collisions. MD5 is broken because collisions are easy to produce."],
      ["Replacing a credit card number with a random value that maps back to it in a secure vault is:",["Tokenization","Masking","Hashing","Steganography"],"Tokenization swaps the data for a token. Masking only hides part of it, like ****-1234."],
      ["Hiding a message inside the pixels of an image is:",["Steganography","Tokenization","Key escrow","Salting"],"Steganography hides that the data exists at all."]
    ]},
  { id:"gc4", t:"PKI & Certificates",
    intro:["A CA signs certificates to vouch for identity","Revocation: CRL (a list) or OCSP (real-time check)","HSM = enterprise key hardware. TPM = chip in one device."],
    pairs:[["CA","Signs and issues certificates"],["CSR","Request sent to a CA"],["CRL","List of revoked certificates"],["OCSP","Live revocation check"],["TPM","Key chip inside one device"]],
    qs:[
      ["What does a server admin send to a Certificate Authority to get a certificate?",["CSR","CRL","OCSP response","PFX"],"A Certificate Signing Request contains the public key and identity info for the CA to sign."],
      ["Which gives REAL-TIME certificate revocation status?",["OCSP","CRL","CSR","Key escrow"],"OCSP answers per certificate on demand. A CRL is a periodically published list."],
      ["A single certificate for *.example.com is a:",["Wildcard certificate","Self-signed certificate","Root certificate","Code-signing certificate"],"A wildcard covers every first-level subdomain of example.com."],
      ["Why do browsers warn about a self-signed certificate?",["No trusted CA vouches for it","It uses weak encryption","It is always expired","It has no public key"],"The encryption may be fine, but no trusted third party has verified the identity."],
      ["A dedicated, tamper-resistant appliance that manages keys for many servers is a(n):",["HSM","TPM","Secure enclave","KDC"],"Hardware Security Modules are built for enterprise-scale key storage and crypto operations."],
      ["BitLocker uses which motherboard chip to store disk encryption keys?",["TPM","HSM","FPGA","BIOS ROM"],"The Trusted Platform Module is built into the device and provides a hardware root of trust."],
      ["Key escrow means:",["A trusted third party holds a copy of keys","Keys rotate automatically","Keys are destroyed after use","Keys are split between two users"],"Escrow lets keys be recovered, for example by the business if an employee leaves."],
      ["OCSP stapling means the web server attaches a timestamped OCSP response to the TLS handshake. True or False?",["True","False"],"Stapling saves the client a trip to the CA and improves privacy and speed."]
    ]}
]},
{ name:"Threats, Vulnerabilities & Mitigations", w:22, c:"#ce82ff", d:"#a568cc", t:"#9b4fd1", lessons:[
  { id:"tv1", t:"Threat Actors",
    intro:["Nation-state = most resources, APTs, espionage","Organized crime = money. Hacktivist = ideology.","Insiders already have access. Shadow IT = unapproved tech."],
    pairs:[["Nation-state","APTs, huge budget"],["Hacktivist","Driven by ideology"],["Organized crime","Driven by money"],["Insider","Already has access"],["Shadow IT","Unapproved tech in the org"]],
    qs:[
      ["Which threat actor typically has the MOST resources and runs advanced persistent threats (APTs)?",["Nation-state","Hacktivist","Unskilled attacker","Insider"],"Governments fund long-term, stealthy campaigns."],
      ["A group defaces a company website to protest its environmental record. This is most likely a:",["Hacktivist","Organized crime group","Nation-state","Competitor"],"Hacktivists are motivated by philosophical or political beliefs."],
      ["A ransomware gang encrypting hospitals for Bitcoin is mainly motivated by:",["Financial gain","Espionage","Ideology","Revenge"],"Organized crime is driven by money."],
      ["A marketing team signs up for an unapproved cloud file-sharing app. This is:",["Shadow IT","An insider attack","Typosquatting","A watering hole"],"Shadow IT is technology used without IT or security approval. It's usually well-meaning but still risky."],
      ["An attacker using downloaded exploit tools without understanding them is an:",["Unskilled attacker","APT","Hacktivist","Nation-state"],"Unskilled attackers (formerly called script kiddies) run tools other people made."],
      ["Which actor is hardest to stop with perimeter firewalls?",["Insider threat","Nation-state","Hacktivist","Unskilled attacker"],"Insiders are already inside the perimeter with legitimate access."],
      ["A USB stick labeled 'Payroll 2026' left in the parking lot uses which threat vector?",["Removable device","Unsecure network","Supply chain","Voice call"],"Dropping infected USB drives (baiting) depends on curiosity."],
      ["Leaving default credentials on a router falls under the 'vulnerable software' threat vector. True or False?",["False","True"],"Default credentials are their own threat vector in SY0-701, separate from vulnerable software."]
    ]},
  { id:"tv2", t:"Social Engineering",
    intro:["Phishing = email, Vishing = voice, Smishing = SMS","Pretexting = a made-up story to build trust","Watering hole = compromise a site the targets already visit"],
    pairs:[["Phishing","Email lure"],["Vishing","Voice call lure"],["Smishing","SMS lure"],["Typosquatting","Misspelled domain"],["Watering hole","Poisoned site the victims visit"]],
    qs:[
      ["A text message saying 'Your package is held, click to pay $1.99' is:",["Smishing","Vishing","Whaling","Pharming"],"SMS phishing is smishing."],
      ["A caller claims to be from the help desk and asks for your password to 'fix your account.' This is:",["Vishing","Smishing","Typosquatting","Watering hole"],"Phishing by voice call is vishing. The help-desk story is the pretext."],
      ["Attackers compromise an industry forum that their target's engineers often visit. This is a:",["Watering hole attack","Spear phishing attack","Brand impersonation","Business email compromise"],"Instead of attacking the target directly, they poison a site the target trusts."],
      ["Registering 'arnazon.com' to catch users who mistype is:",["Typosquatting","Pretexting","Domain hijacking","DNS poisoning"],"Typosquatting (URL hijacking) takes advantage of typing mistakes."],
      ["The CFO's real email account is compromised and used to request an urgent wire transfer. This is:",["Business email compromise","Smishing","Watering hole","Misinformation"],"BEC uses a trusted, often real, business email account to commit fraud."],
      ["An attacker invents a believable story ('I'm the new auditor, I need access…') to manipulate a target. This is:",["Pretexting","Tailgating","Baiting","Shoulder surfing"],"Pretexting is building a fake scenario to get information or access."],
      ["Following an employee through a secure door without badging in is:",["Tailgating","Pretexting","Vishing","Typosquatting"],"Tailgating or piggybacking is a physical social engineering technique. Access control vestibules (mantraps) stop it."],
      ["The BEST overall defense against phishing is:",["User awareness training plus technical email filtering","Longer passwords only","Disabling USB ports","Full disk encryption"],"People and filters together. Training helps users spot what the filters miss."]
    ]},
  { id:"tv3", t:"Malware & Indicators",
    intro:["Virus needs a host and user action. Worm spreads by itself.","Trojan pretends to be legit. Rootkit hides deep in the OS.","Logic bomb waits for a trigger. Fileless malware lives in memory."],
    pairs:[["Worm","Self-spreading"],["Trojan","Disguised as legit software"],["Rootkit","Hides in the OS/kernel"],["Logic bomb","Triggered by a condition"],["Ransomware","Encrypts files for payment"]],
    qs:[
      ["Malware that spreads across the network by ITSELF, without user interaction, is a:",["Worm","Virus","Trojan","Logic bomb"],"Worms self-propagate by exploiting vulnerabilities."],
      ["A 'free PDF converter' that secretly installs a backdoor is a:",["Trojan","Worm","Rootkit","Bloatware"],"Trojans disguise themselves as legitimate software."],
      ["Code set to delete payroll records if a certain employee is removed from HR systems is a:",["Logic bomb","Keylogger","Worm","RAT"],"A logic bomb runs when a condition or date is met."],
      ["Malware that modifies the kernel to hide its processes from the OS is a:",["Rootkit","Spyware","Adware","Ransomware"],"Rootkits hide at a deep level and are hard to detect from inside the infected OS."],
      ["Malware that runs entirely in memory using PowerShell, leaving little on disk, is:",["Fileless malware","A boot-sector virus","Bloatware","A macro virus"],"Fileless attacks live off the land with built-in tools and avoid file-based antivirus."],
      ["A user logs in from Sacramento and then from Moscow 5 minutes later. This indicator is:",["Impossible travel","Resource consumption","Out-of-cycle logging","Blocked content"],"A person can't physically be in both places, so the credentials are probably compromised."],
      ["Which malware records everything a user types?",["Keylogger","Logic bomb","Worm","Bloatware"],"Keyloggers capture keystrokes such as passwords and messages."],
      ["Gaps in a log file during the time of a suspected breach are an indicator of compromise. True or False?",["True","False"],"Missing logs are a listed indicator. Attackers often wipe logs to cover their tracks."]
    ]},
  { id:"tv4", t:"Network & Password Attacks",
    intro:["Spraying = a few passwords against many accounts. Brute force = many passwords against one.","On-path = attacker sits between two parties. ARP poisoning enables it on a LAN.","Replay = resending captured valid traffic. Downgrade = forcing weaker crypto."],
    pairs:[["Spraying","Few passwords, many accounts"],["Brute force","Many passwords, one account"],["Replay","Resend captured traffic"],["Downgrade","Force weaker crypto"],["Evil twin","Fake Wi-Fi access point"]],
    qs:[
      ["Trying 'Winter2026!' against 5,000 accounts to avoid lockouts is:",["Password spraying","Brute force","Rainbow table attack","Birthday attack"],"Spraying uses a few common passwords across many accounts, which stays under lockout thresholds."],
      ["An attacker on the LAN sends forged ARP replies so traffic flows through their machine. This enables a(n):",["On-path attack","DNS amplification","Replay attack","SQL injection"],"ARP poisoning is a classic way to get on-path (man-in-the-middle) on a local network."],
      ["Capturing a valid authentication token and resending it later to gain access is a:",["Replay attack","Downgrade attack","Birthday attack","Directory traversal"],"Timestamps, nonces and session expiry defend against replay."],
      ["Forcing a connection to use an older, weaker version of TLS is a:",["Downgrade attack","Replay attack","Collision attack","Privilege escalation"],"Downgrade attacks make crypto weaker so the attacker can break it. SSL stripping is one example."],
      ["A request for '../../../../etc/passwd' in a URL indicates:",["Directory traversal","XSS","Buffer overflow","Password spraying"],"Directory traversal escapes the web root to read files the server shouldn't serve."],
      ["Small spoofed DNS queries that trigger large responses aimed at a victim are:",["An amplified DDoS","DNS poisoning","Domain hijacking","Typosquatting"],"Amplification multiplies the attacker's bandwidth with reflectors like open DNS resolvers."],
      ["A rogue access point broadcasting the same SSID as the corporate Wi-Fi is an:",["Evil twin","Bluejacking attack","Jamming attack","RFID clone"],"Evil twins trick users into connecting so the attacker can intercept their traffic."],
      ["Which attack exploits hash collisions, based on probability math?",["Birthday attack","Pass-the-hash","Password spraying","Replay"],"The birthday paradox makes collisions far likelier than intuition suggests, which is why longer hashes are used."]
    ]},
  { id:"tv5", t:"App & System Vulnerabilities",
    intro:["SQL injection → fix with parameterized queries and input validation","XSS = injecting script into pages other users see","Zero-day = no patch exists yet"],
    pairs:[["SQL injection","Malicious database queries"],["XSS","Script runs in victims' browsers"],["Buffer overflow","Writes past memory bounds"],["Race condition","Timing flaw (TOCTOU)"],["Zero-day","No patch exists yet"]],
    qs:[
      ["Entering ' OR 1=1 -- into a login form is an attempt at:",["SQL injection","XSS","CSRF","Buffer overflow"],"It tries to make the WHERE clause always true."],
      ["The BEST defense against SQL injection is:",["Parameterized queries (prepared statements)","Longer passwords","TLS encryption","A honeypot"],"Prepared statements treat user input as data, never as executable SQL."],
      ["An attacker posts a forum comment containing a \x3Cscript> tag that runs in other users' browsers. This is:",["Cross-site scripting (XSS)","SQL injection","Directory traversal","Race condition"],"XSS injects client-side script that runs for other users."],
      ["Writing more data into a memory buffer than it can hold, which overwrites adjacent memory, is a:",["Buffer overflow","Race condition","Memory leak","Integer overflow"],"Buffer overflows can let attackers run their own code. Bounds checking and ASLR help."],
      ["A file is checked for permission, then swapped before it's used. This TOCTOU flaw is a:",["Race condition","Buffer overflow","Zero-day","Injection"],"Time-of-check to time-of-use is a race condition. The state changes between the check and the use."],
      ["A vulnerability with no vendor patch available yet is a:",["Zero-day","False positive","Legacy flaw","Misconfiguration"],"Defenders have had zero days to fix it."],
      ["Installing an Android app from a random website instead of the Play Store is:",["Sideloading","Jailbreaking","Rooting","Geofencing"],"Sideloading skips app store vetting. Jailbreaking or rooting removes OS restrictions."],
      ["Attackers compromise a vendor's software update so every customer installs malware. This is a:",["Supply chain attack","Watering hole","VM escape","Typosquatting"],"Supply chain attacks abuse trust in a vendor. SolarWinds is the classic example."]
    ]}
]},
{ name:"Security Architecture", w:18, c:"#1cb0f6", d:"#1899d6", t:"#1899d6", lessons:[
  { id:"sa1", t:"Cloud & Infrastructure",
    intro:["IaaS → you manage the most. SaaS → the provider manages the most.","IaC = infrastructure defined as code (repeatable, auditable)","Air-gapped = physically isolated. SDN splits the control and data planes."],
    pairs:[["IaaS","You manage OS and up"],["SaaS","Provider manages almost everything"],["IaC","Infrastructure defined in code"],["Air gap","Physically isolated network"],["SDN","Separates control and data planes"]],
    qs:[
      ["In which cloud model does the CUSTOMER manage the operating system?",["IaaS","SaaS","PaaS","FaaS"],"In IaaS the provider gives you VMs, storage and networking, and you handle the OS and up."],
      ["Even with SaaS, the customer is still responsible for:",["Their data and user access","Physical datacenter security","Hypervisor patching","Application code"],"The shared responsibility model always leaves data and identity with the customer."],
      ["Deploying servers from version-controlled Terraform templates is:",["Infrastructure as Code","Serverless","Microservices","SD-WAN"],"IaC makes infrastructure consistent and repeatable, and changes are reviewable."],
      ["Software-Defined Networking separates which two planes?",["Control plane and data plane","Physical and logical layers","LAN and WAN","Public and private clouds"],"SDN centralizes the control plane (decisions), while devices handle the data plane (forwarding)."],
      ["A network that is physically disconnected from all other networks is:",["Air-gapped","Segmented with VLANs","Behind a DMZ","Zero trust"],"An air gap means no network path at all. Data moves by removable media."],
      ["Industrial systems controlling a power plant's equipment are called:",["ICS/SCADA","IoT","Microservices","SD-WAN"],"SCADA and ICS are often legacy and hard to patch, so they need heavy segmentation."],
      ["Containers differ from VMs because containers:",["Share the host OS kernel","Each run a full guest OS","Can't run on Linux","Need a Type 1 hypervisor"],"Sharing the kernel makes containers light, but a kernel flaw can affect every container."],
      ["Embedded systems and RTOS devices are often hard to secure because they are difficult to patch. True or False?",["True","False"],"Limited compute, long lifecycles and vendor dependence make patching hard."]
    ]},
  { id:"sa2", t:"Network Security Devices",
    intro:["IDS alerts (passive). IPS blocks (inline).","Fail-closed blocks traffic on failure (security first). Fail-open passes it (availability first).","802.1X = port-based network access control, usually with RADIUS"],
    pairs:[["IDS","Detects and alerts"],["IPS","Detects and blocks inline"],["WAF","Protects web apps (Layer 7)"],["Jump server","Hardened admin entry point"],["802.1X","Port-based access control"]],
    qs:[
      ["Which device sits INLINE and can actively block malicious traffic?",["IPS","IDS","SIEM","Network tap"],"IDS watches and alerts. IPS is in the traffic path and drops bad packets."],
      ["A firewall configured so that if it crashes, ALL traffic is blocked, is:",["Fail-closed","Fail-open","Active/active","Stateless"],"Fail-closed puts security ahead of availability."],
      ["Admins first connect to a hardened server and from there reach internal servers. That server is a:",["Jump server","Reverse proxy","Load balancer","Honeypot"],"A jump server (bastion host) is a single controlled entry point for administration."],
      ["Which device protects web apps specifically from SQL injection and XSS?",["WAF","Layer 4 firewall","NAT router","Switch"],"A web application firewall inspects HTTP traffic at Layer 7."],
      ["Port-based authentication that blocks a device until it authenticates is:",["802.1X","WPA2-PSK","NAT","Port mirroring"],"802.1X uses a supplicant, an authenticator (switch/AP) and an authentication server (RADIUS)."],
      ["IPsec mode that encrypts the ENTIRE original packet, used for site-to-site VPNs:",["Tunnel mode","Transport mode","AH-only mode","Aggressive mode"],"Tunnel mode wraps the whole packet in a new header. Transport mode only encrypts the payload."],
      ["A server placed in a separate network zone so the internet can reach it but not the internal LAN is in a:",["Screened subnet (DMZ)","VLAN trunk","Air gap","Intranet"],"A screened subnet isolates public-facing services from internal systems."],
      ["SASE combines cloud-delivered security services with SD-WAN networking. True or False?",["True","False"],"Secure Access Service Edge moves security to the cloud, close to remote users."]
    ]},
  { id:"sa3", t:"Data Protection",
    intro:["Data states: at rest, in transit, in use","Data sovereignty = data is subject to the laws of the country where it's stored","Protect with encryption, hashing, masking, tokenization and segmentation"],
    pairs:[["At rest","Stored on disk"],["In transit","Moving across a network"],["In use","Being processed in memory"],["Sovereignty","Local laws apply to the data"],["DLP","Stops sensitive data leaving"]],
    qs:[
      ["A database file stored on a server's SSD is data:",["At rest","In transit","In use","In motion"],"At rest means stored. Protect it with full disk or database encryption."],
      ["Data actively being processed in RAM by an application is data:",["In use","At rest","In transit","Archived"],"Data in use is the hardest to protect. Secure enclaves help."],
      ["A company must keep EU citizens' data on servers inside the EU. This is about:",["Data sovereignty","Data masking","Data retention","Data classification"],"Sovereignty means the data falls under the laws of the place where it physically lives."],
      ["Showing only the last 4 digits of an SSN on a screen is:",["Masking","Tokenization","Hashing","Encryption"],"Masking hides part of the data from view."],
      ["Medical records are classified as which data type?",["PHI","Trade secret","Public","Intellectual property"],"Protected Health Information is regulated, for example by HIPAA."],
      ["Which tool detects and blocks sensitive data such as credit card numbers from leaving the network?",["DLP","IDS","NAC","SIEM"],"Data Loss Prevention inspects content to stop data from leaking out."],
      ["TLS protects data in which state?",["In transit","At rest","In use","Archived"],"TLS encrypts data moving across the network."],
      ["Restricting access to data based on the user's geographic location is a valid data protection method. True or False?",["True","False"],"Geographic restrictions (geofencing) are a listed method in the objectives."]
    ]},
  { id:"sa4", t:"Resilience & Recovery",
    intro:["Hot site = ready now. Warm = partly ready. Cold = empty space.","RTO = how fast you must be back. RPO = how much data you can lose.","Restoring a differential = full + the latest differential. Restoring incrementals = full + every incremental."],
    pairs:[["Hot site","Ready immediately"],["Cold site","Empty space, power only"],["RTO","Max downtime allowed"],["RPO","Max data loss allowed"],["UPS","Short-term battery power"]],
    qs:[
      ["Which recovery site is fully equipped with current data and can take over almost immediately?",["Hot site","Warm site","Cold site","Mobile site"],"Hot sites are the most expensive and the fastest."],
      ["'We can lose at most 4 hours of data' describes the:",["RPO","RTO","MTTR","MTBF"],"The Recovery Point Objective is the maximum acceptable data loss, measured in time."],
      ["'Systems must be back online within 2 hours' describes the:",["RTO","RPO","MTBF","SLE"],"The Recovery Time Objective is the maximum acceptable downtime."],
      ["Full backup on Sunday, DIFFERENTIAL every other day. Restoring Thursday needs:",["Sunday full + Wednesday's differential","Sunday full + every differential","Only Wednesday's differential","Every backup since Sunday in order"],"A differential contains all changes since the last full backup, so you only need the newest one."],
      ["Full backup on Sunday, INCREMENTAL every other day. Restoring Thursday needs:",["Sunday full + Mon, Tue and Wed incrementals","Sunday full + Wed incremental only","Only Wednesday's incremental","Just the Sunday full"],"Each incremental only holds changes since the previous backup, so you need the whole chain."],
      ["Which provides SHORT-term power to ride out a brief outage or bridge to a generator?",["UPS","Generator","PDU","Dual NICs"],"A UPS gives seconds to minutes of battery power. A generator covers long outages."],
      ["A discussion-based walk-through of a disaster scenario with no systems touched is a:",["Tabletop exercise","Failover test","Parallel processing test","Live simulation"],"Tabletop exercises are cheap and useful for checking roles and plans."],
      ["Average time between failures of a component is:",["MTBF","MTTR","RTO","RPO"],"Mean Time Between Failures measures reliability. MTTR is the mean time to repair."]
    ]}
]},
{ name:"Security Operations", w:28, c:"#ff9600", d:"#cc7800", t:"#cc7800", lessons:[
  { id:"so1", t:"Hardening & Mobile",
    intro:["Hardening: disable unused services, change defaults, patch, use a secure baseline","WPA3 uses SAE instead of the PSK handshake, which blocks offline dictionary attacks","BYOD = employee-owned. COPE = corporate-owned, personal use OK. CYOD = choose from an approved list."],
    pairs:[["BYOD","Employee owns device"],["COPE","Company owns, personal use OK"],["CYOD","Pick from approved list"],["MDM","Manages mobile devices centrally"],["WPA3","Wi-Fi security using SAE"]],
    qs:[
      ["Which wireless security protocol uses SAE to protect against offline dictionary attacks?",["WPA3","WPA2-PSK","WEP","WPS"],"Simultaneous Authentication of Equals replaces WPA2's crackable four-way PSK handshake."],
      ["A company buys phones for employees and lets them use them personally. This model is:",["COPE","BYOD","CYOD","VDI"],"Corporate-Owned, Personally Enabled."],
      ["Which centrally enforces passcodes and remote wipe on company phones?",["MDM","NAC","SIEM","WAF"],"Mobile Device Management enforces policy on mobile devices."],
      ["Degaussing will NOT reliably sanitize which media?",["SSDs","Magnetic hard drives","Backup tapes","Floppy disks"],"Degaussing disrupts magnetic fields, and SSDs store data in flash memory. Shred them or use cryptographic erase."],
      ["The FIRST step in managing secure configurations is to:",["Establish a secure baseline","Deploy patches","Run a pen test","Buy an EDR tool"],"Establish, deploy, then maintain the baseline."],
      ["Restricting an app's functions when a device leaves a defined physical area is:",["Geofencing","Sideloading","Geotagging","Carrier unlocking"],"Geofencing triggers actions based on GPS or network location."],
      ["A document a vendor gives you proving drives were destroyed is a:",["Certificate of destruction","Chain of custody","Legal hold","SOW"],"It provides documented proof of proper disposal, which matters for compliance."],
      ["Changing default passwords and disabling unneeded ports are both hardening techniques. True or False?",["True","False"],"Both reduce the attack surface."]
    ]},
  { id:"so2", t:"Identity & Access",
    intro:["SAML = XML-based web SSO. OAuth = authorization (delegated access). OIDC = authentication built on OAuth.","Factors: something you know, have, are, and somewhere you are","Least privilege. PAM gives just-in-time admin access and password vaulting."],
    pairs:[["SAML","XML web SSO"],["OAuth","Delegated authorization"],["OIDC","Authentication on top of OAuth"],["RBAC","Access by job role"],["MAC","Access by labels/clearance"]],
    qs:[
      ["'Log in with Google' on a third-party site, which proves WHO you are, typically uses:",["OpenID Connect","Kerberos","RADIUS","TACACS+"],"OIDC adds authentication on top of OAuth 2.0."],
      ["Letting a printing app access your Google Photos WITHOUT giving it your password uses:",["OAuth","LDAP","TACACS+","NTLM"],"OAuth delegates authorization with tokens, not credentials."],
      ["Which is an XML-based standard used for enterprise web single sign-on?",["SAML","OAuth","JSON Web Key","SNMP"],"SAML passes authentication and authorization assertions between an IdP and a service provider."],
      ["Password + security question is how many authentication FACTORS?",["One","Two","Three","Zero"],"Both are something you know. That's two items but only one factor."],
      ["Smart card + PIN is:",["Two factors (have + know)","One factor","Three factors","Biometric authentication"],"Different categories make it real MFA."],
      ["Access based on a user's job title (e.g., 'Nurse') is:",["Role-based access control","Mandatory access control","Discretionary access control","Time-of-day restriction"],"RBAC assigns permissions to roles, and users get roles."],
      ["Access decided by labels and clearance levels (Secret, Top Secret) is:",["Mandatory access control","Discretionary access control","Role-based","Attribute-based"],"With MAC, the OS enforces labels and users can't change them."],
      ["Granting admin rights only for a 1-hour maintenance window, then revoking them automatically, is:",["Just-in-time permissions","Federation","Attestation","Discretionary access"],"JIT access is a PAM feature that leaves no standing privileges to steal."]
    ]},
  { id:"so3", t:"Monitoring & Email Security",
    intro:["SIEM = collect, correlate and alert on logs from everywhere","SPF = which servers may send. DKIM = signature on the message. DMARC = what to do on failure, plus reports.","EDR = endpoint detection and response. FIM = alerts on changes to critical files."],
    pairs:[["SIEM","Correlates logs into alerts"],["SPF","Authorized sending servers"],["DKIM","Signs email"],["DMARC","Policy + reporting for failures"],["FIM","Detects file changes"]],
    qs:[
      ["Which tool aggregates and CORRELATES logs from many sources into alerts?",["SIEM","DLP","NAC","WAF"],"Security Information and Event Management centralizes logs for analysis."],
      ["A DNS record listing which mail servers may send email for your domain is:",["SPF","DKIM","DMARC","DNSSEC"],"Sender Policy Framework is published as a DNS TXT record."],
      ["Which adds a cryptographic signature to outgoing email so receivers can verify it wasn't altered?",["DKIM","SPF","DMARC","MX record"],"DomainKeys Identified Mail signs the message headers and body."],
      ["Which tells receiving servers what to do (quarantine/reject) when SPF/DKIM fail, and sends reports?",["DMARC","SPF","DKIM","DNSSEC"],"DMARC builds a policy and reporting layer on top of SPF and DKIM."],
      ["A tool that alerts when C:\\Windows\\System32 files are changed is:",["File integrity monitoring","DLP","NetFlow","A honeypot"],"FIM compares file hashes to a known-good baseline."],
      ["Which records traffic METADATA (source, destination, ports, bytes) rather than full packets?",["NetFlow","Packet capture","SIEM","DLP"],"NetFlow shows who talked to whom and how much, without the payloads."],
      ["Which standard enables automated, consistent vulnerability and configuration checks across tools?",["SCAP","SNMP","SAML","SASE"],"The Security Content Automation Protocol standardizes checklists and results."],
      ["Tuning SIEM alert rules mainly aims to reduce false positives. True or False?",["True","False"],"Alert fatigue makes analysts miss real attacks."]
    ]},
  { id:"so4", t:"Vulnerability Management",
    intro:["CVE = the vulnerability's ID. CVSS = its severity score from 0 to 10.","False positive = flagged but not real. False negative = real but missed (worse).","Credentialed scans see deeper. Rescan to validate a fix."],

    qs:[

/* ---------- index ---------- */
const LESSONS=[], ALLQ={};
UNITS.forEach((u,ui)=>{ u.n=ui+1; u.lessons.forEach((l,li)=>{ l.u=u; l.li=li; LESSONS.push(l);
  l.qids=l.qs.map((x,i)=>{ const id=l.id+"."+i; ALLQ[id]={id,q:x[0],opts:x[1],e:x[2],l,u}; return id; }); }); });
const BYID=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const TOTALQ=Object.keys(ALLQ).length;

/* ---------- utils ---------- */
const DAY=864e5, REGEN=2*36e5, MAXH=5, IV=[0,1,3,7,16,35];
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ydayKey=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uvars=u=>`--uc:${u.c};--ud:${u.d};--uc2:${u.t}`;
function fmtDur(ms){ms=Math.max(0,ms);const m=Math.floor(ms/6e4),s=Math.floor(ms%6e4/1e3);return m+":"+pad(s)}
function fmtHM(ms){const h=Math.floor(ms/36e5),m=Math.ceil(ms%36e5/6e4);return h?`${h}h ${m}m`:`${m}m`}

/* ---------- state + persistence ---------- */
const LS_KEY="secplus-quest-v1";
function defState(){return{v:1,xp:0,streak:0,longest:0,lastGoalDay:"",days:{},hearts:MAXH,heartsAt:Date.now(),lessons:{},srs:{},exams:[],settings:{goal:30,examDate:"",sound:true},updatedAt:0}}
function normalize(o){const s=Object.assign(defState(),o||{});s.settings=Object.assign(defState().settings,(o&&o.settings)||{});
  ["days","lessons","srs"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={}}); if(!Array.isArray(s.exams))s.exams=[];
  if(typeof s.hearts!=="number")s.hearts=MAXH; return s}
let S=defState();
try{const raw=localStorage.getItem(LS_KEY); if(raw)S=normalize(JSON.parse(raw))}catch(e){}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}

const cloud={ref:null,status:"local",writing:false,pending:false,timer:null,retried:false};
function save(){S.updatedAt=Date.now(); lsSet(); pushWidget(); if(cloud.ref){clearTimeout(cloud.timer); cloud.timer=setTimeout(pushCloud,1200)}}
/* Android app: hand a small summary to the native home-screen widget */
function pushWidget(){ try{ const B=window.AndroidBridge; if(!B||!B.saveState)return; const t=dayKey();
  B.saveState(JSON.stringify({streak:S.streak,lastGoalDay:S.lastGoalDay,todayKey:t,todayXP:S.days[t]||0,goal:S.settings.goal,
    dues:Object.keys(S.srs).filter(id=>ALLQ[id]).map(id=>S.srs[id].d),hearts:S.hearts,heartsAt:S.heartsAt,xp:S.xp,
    examDate:S.settings.examDate,lessonsDone:LESSONS.filter(isDone).length,lessons:LESSONS.length})) }catch(e){} }
async function pushCloud(){
  if(!cloud.ref)return;
  if(cloud.writing){cloud.pending=true;return}
  cloud.writing=true;
  try{ await cloud.ref.set({v:1,updatedAt:S.updatedAt,state:JSON.parse(JSON.stringify(S))}); cloud.status="synced"; cloud.retried=false; }
  catch(e){ const c=e&&e.code;
    if((c==="unavailable"||c==="resource_exhausted")&&!cloud.retried){cloud.retried=true;cloud.pending=true;await sleep(2000+Math.random()*2000)}
    else{cloud.ref=null;cloud.status="local"} }
  cloud.writing=false; refreshSync();
  if(cloud.pending&&cloud.ref){cloud.pending=false;pushCloud()}
}
async function initCloud(){
  if(!(window.claude&&typeof window.claude.use==="function"))return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.collection("data/users/"+id).doc("progress");
    cloud.status="connecting"; refreshSync();
    const snap=await ref.get();
    cloud.ref=ref; cloud.status="synced";
    const rs=snap.exists?(snap.data()||{}).state:null;
    if(rs&&(rs.updatedAt||0)>(S.updatedAt||0)){
      S=normalize(JSON.parse(JSON.stringify(rs))); lsSet(); regen();
      if(view!=="session"&&view!=="result")render();
    }else if(S.updatedAt&&(!rs||(S.updatedAt>(rs.updatedAt||0)))){ pushCloud(); }
    refreshSync();
  }catch(e){cloud.ref=null;cloud.status="local";refreshSync()}
}
function refreshSync(){const el=document.getElementById("sync"); if(el)el.outerHTML=syncHTML()}
function syncHTML(){const ok=cloud.status==="synced";return `<div id="sync" class="sync ${ok?"ok":""}"><i></i>${ok?"Progress synced to your Claude account":cloud.status==="connecting"?"Connecting…":"Progress saved on this device"}</div>`}

/* ---------- game rules ---------- */
function regen(){ if(S.hearts>=MAXH){S.hearts=MAXH;return false}
  const n=Math.floor((Date.now()-S.heartsAt)/REGEN); if(n>0){S.hearts=Math.min(MAXH,S.hearts+n);S.heartsAt+=n*REGEN;return true} return false }
function loseHeart(){ if(S.hearts>=MAXH)S.heartsAt=Date.now(); S.hearts=Math.max(0,S.hearts-1) }
function nextHeartIn(){return REGEN-(Date.now()-S.heartsAt)}
function addXP(n){ const t=dayKey(); S.xp+=n; S.days[t]=(S.days[t]||0)+n;
  const ks=Object.keys(S.days).sort(); while(ks.length>60)delete S.days[ks.shift()];
  if(S.days[t]>=S.settings.goal&&S.lastGoalDay!==t){ S.streak=S.lastGoalDay===ydayKey()?S.streak+1:1; S.lastGoalDay=t; S.longest=Math.max(S.longest,S.streak); return true }
  return false }
function curStreak(){return (S.lastGoalDay===dayKey()||S.lastGoalDay===ydayKey())?S.streak:0}
function grade(id,ok){ const r=S.srs[id]||{b:0,d:0,s:0,c:0}; r.s++; if(ok){r.c++;r.b=Math.min(5,r.b+1)}else r.b=0;
  r.d=Date.now()+(ok?IV[r.b]*DAY:10*6e4); S.srs[id]=r }
const box=id=>(S.srs[id]&&S.srs[id].b)||0;
const mastery=ids=>ids.length?ids.reduce((a,id)=>a+Math.min(box(id),4)/4,0)/ids.length:0;
const unitQids=u=>u.lessons.flatMap(l=>l.qids);
function readiness(){return UNITS.reduce((a,u)=>a+u.w*mastery(unitQids(u)),0)/100}
const isDone=l=>!!(S.lessons[l.id]&&S.lessons[l.id].done);
const isUnlocked=l=>l.li===0||isDone(l.u.lessons[l.li-1]);
function currentLesson(){return LESSONS.find(l=>isUnlocked(l)&&!isDone(l))||null}
function dueIds(){const now=Date.now();return Object.keys(S.srs).filter(id=>ALLQ[id]&&S.srs[id].d<=now).sort((a,b)=>S.srs[a].d-S.srs[b].d)}
function daysToExam(){ if(!S.settings.examDate)return null; const [y,m,d]=S.settings.examDate.split("-").map(Number);
  const t=new Date(y,m-1,d); const now=new Date(); now.setHours(0,0,0,0); return Math.round((t-now)/DAY) }

/* ---------- sound ---------- */
let actx=null;
function sfx(kind){ if(!S.settings.sound)return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const N={good:[660,990],bad:[200,160],done:[523,659,784,1047],tap:[880],pair:[740,988]}[kind]||[880];
    N.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;
      const t=actx.currentTime+i*0.085;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(kind==="tap"?0.04:0.13,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="done"?0.3:0.18));o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.32)}) }catch(e){}
  if(kind==="bad"){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}} }

/* ---------- icons ---------- */
const IC={
  star:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

};

/* ---------- views ---------- */

function examView(){
  let h=`<div class="card hero"><div class="e">📝</div><h3>Practice exam</h3><div class="muted">30 questions in 35 minutes, weighted like the real SY0-701 domains. You won't see answers until the end.</div>
