plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version so updates install over the old app
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.secplusquest.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.secplusquest.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Release signing key comes from environment variables (GitHub Actions secrets).
    // Nothing secret is stored in this repo.
    def keystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
    def hasSigningKey = keystorePath && file(keystorePath).exists()

    signingConfigs {
        if (hasSigningKey) {
            release {
                // Same key every build, so new versions install as updates (progress is kept)
                storeFile file(keystorePath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
